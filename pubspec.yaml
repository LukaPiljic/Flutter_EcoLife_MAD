name: ecolife
description: EcoLife — a gamified environmental awareness app (Flutter port of the Kotlin MAD_EcoLife project).
publish_to: "none"
version: 7.0.0+7

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  http: ^1.2.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.4
  firebase_ui_auth: ^1.16.0
  firebase_ui_oauth_google: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3
  firebase_auth_mocks: ^0.14.1
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/
  # fonts:

# Run `dart run flutter_launcher_icons` after changing the source art in
# assets/icon/ (regenerate that art with `python3 tool/gen_logo.py`).
flutter_launcher_icons:
  image_path: "assets/icon/ecolife_logo.png"
  android: "ic_launcher"
  min_sdk_android: 23
  adaptive_icon_background: "#2E7D32"
  adaptive_icon_foreground: "assets/icon/ecolife_logo_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/ecolife_logo.png"
